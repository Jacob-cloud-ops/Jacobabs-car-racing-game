<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacobabs Car Racing</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 12px 0 3px;
    font-size: 26px;
}

#subtitle {
    color: #aaa;
    margin-bottom: 7px;
}

#scoreBox {
    font-size: 16px;
    font-weight: bold;
    margin: 8px auto;
    max-width: 340px;
}

#game {
    position: relative;
    width: 330px;
    height: 520px;
    margin: auto;
    overflow: hidden;
    background: #555;
    border-left: 7px solid white;
    border-right: 7px solid white;
}

.grass {
    position: absolute;
    top: 0;
    width: 38px;
    height: 100%;
    background: #16833c;
    z-index: 0;
}

#grassLeft {
    left: 0;
}

#grassRight {
    right: 0;
}

.road {
    position: absolute;
    left: 38px;
    right: 38px;
    top: 0;
    bottom: 0;
    background: #555;
    z-index: 0;
}

.line {
    position: absolute;
    width: 7px;
    height: 75px;
    background: white;
    left: 159px;
    z-index: 1;
}

.tree {
    position: absolute;
    width: 22px;
    height: 22px;
    background: #0c672d;
    border-radius: 50%;
    z-index: 2;
}

.tree:after {
    content: "";
    position: absolute;
    width: 7px;
    height: 14px;
    background: #704214;
    left: 8px;
    top: 17px;
}

.car {
    position: absolute;
    width: 50px;
    height: 82px;
    border: 3px solid #111;
    border-radius: 12px;
    z-index: 5;
}

.car:before {
    content: "";
    position: absolute;
    left: 7px;
    top: 8px;
    width: 30px;
    height: 25px;
    background: #9ee7f5;
    border: 2px solid #222;
    border-radius: 6px;
}

.car:after {
    content: "";
    position: absolute;
    left: 21px;
    top: 39px;
    width: 6px;
    height: 35px;
    background: rgba(255,255,255,.4);
    border-radius: 3px;
}

.wheel {
    position: absolute;
    width: 8px;
    height: 20px;
    background: black;
    border-radius: 4px;
}

.w1 {
    left: -7px;
    top: 15px;
}

.w2 {
    right: -7px;
    top: 15px;
}

.w3 {
    left: -7px;
    bottom: 15px;
}

.w4 {
    right: -7px;
    bottom: 15px;
}

#player {
    left: 138px;
    bottom: 25px;
    background: #e53935;
}

.enemy1 {
    background: #1976d2;
}

.enemy2 {
    background: #fbc02d;
}

.enemy3 {
    background: #8e24aa;
}

.enemy4 {
    background: #ef6c00;
}

.coin {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: gold;
    border: 3px solid #fff2a8;
    color: #805d00;
    font-weight: bold;
    line-height: 22px;
    z-index: 4;
    box-shadow: 0 0 8px gold;
}

#message {
    min-height: 25px;
    margin: 8px auto;
    max-width: 330px;
}

#startButton {
    padding: 14px 28px;
    margin: 5px 0 10px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 5px;
}

.control {
    width: 90px;
    height: 58px;
    border: none;
    border-radius: 11px;
    background: #333;
    color: white;
    font-size: 28px;
}

#tip {
    color: #999;
    font-size: 13px;
    margin: 8px;
}
</style>
</head>

<body>

<h1>🏎️ Jacobabs Car Racing</h1>
<div id="subtitle">Highway Challenge</div>

<div id="scoreBox">
    🏆 Score: <span id="score">0</span>
    &nbsp; ⭐ Best: <span id="best">0</span>
    &nbsp; 🪙 Coins: <span id="coins">0</span>
</div>

<div id="game">

    <div class="grass" id="grassLeft"></div>
    <div class="grass" id="grassRight"></div>
    <div class="road"></div>

    <div class="line" id="line1" style="top:0"></div>
    <div class="line" id="line2" style="top:130px"></div>
    <div class="line" id="line3" style="top:260px"></div>
    <div class="line" id="line4" style="top:390px"></div>

    <div class="tree" id="tree1" style="left:7px;top:30px"></div>
    <div class="tree" id="tree2" style="right:7px;top:150px"></div>
    <div class="tree" id="tree3" style="left:7px;top:280px"></div>
    <div class="tree" id="tree4" style="right:7px;top:410px"></div>

    <div id="player" class="car">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

    <div id="enemy1" class="car enemy1">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

    <div id="enemy2" class="car enemy2">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

    <div id="enemy3" class="car enemy3">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

    <div id="enemy4" class="car enemy4">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

    <div id="coin" class="coin">$</div>

</div>

<div id="message">Press START GAME to begin</div>

<button type="button" id="startButton">START GAME</button>

<div class="controls">
    <button type="button" class="control" id="leftButton">⬅️</button>
    <button type="button" class="control" id="rightButton">➡️</button>
</div>

<div id="tip">
    Use the buttons, keyboard arrows, or swipe left and right.
</div>

<script>
var player = document.getElementById("player");
var startButton = document.getElementById("startButton");
var scoreText = document.getElementById("score");
var bestText = document.getElementById("best");
var coinsText = document.getElementById("coins");
var message = document.getElementById("message");
var coin = document.getElementById("coin");

var enemies = [
    document.getElementById("enemy1"),
    document.getElementById("enemy2"),
    document.getElementById("enemy3"),
    document.getElementById("enemy4")
];

var lines = document.querySelectorAll(".line");
var trees = document.querySelectorAll(".tree");

var playerX = 138;
var score = 0;
var coins = 0;
var speed = 5;
var playing = false;
var animation = null;

var enemyX = [55, 115, 175, 225];
var enemyY = [-100, -300, -520, -760];

var coinX = 130;
var coinY = -200;

var bestScore =
    Number(localStorage.getItem("jacobabsBestScore")) || 0;

bestText.innerHTML = bestScore;

function randomRoadX() {
    return 48 + Math.floor(Math.random() * 210);
}

function moveLeft() {

    if (!playing) return;

    playerX = playerX - 25;

    if (playerX < 45) {
        playerX = 45;
    }

    player.style.left = playerX + "px";
}

function moveRight() {

    if (!playing) return;

    playerX = playerX + 25;

    if (playerX > 235) {
        playerX = 235;
    }

    player.style.left = playerX + "px";
}

function resetGame() {

    playerX = 138;

    score = 0;
    coins = 0;
    speed = 5;

    player.style.left = playerX + "px";

    for (var i = 0; i < enemies.length; i++) {

        enemyY[i] =
            -100 - (i * 230);

        enemyX[i] =
            randomRoadX();

        enemies[i].style.left =
            enemyX[i] + "px";

        enemies[i].style.top =
            enemyY[i] + "px";
    }

    coinY = -200;
    coinX = randomRoadX();

    coin.style.left = coinX + "px";
    coin.style.top = coinY + "px";

    scoreText.innerHTML = "0";
    coinsText.innerHTML = "0";
}

function startGame() {

    if (animation !== null) {
        cancelAnimationFrame(animation);
    }

    resetGame();

    playing = true;

    message.innerHTML =
        "Avoid the cars and collect coins!";

    startButton.innerHTML =
        "RESTART GAME";

    gameLoop();
}

function collision(a, b) {

    var A = a.getBoundingClientRect();
    var B = b.getBoundingClientRect();

    return (
        A.left < B.right &&
        A.right > B.left &&
        A.top < B.bottom &&
        A.bottom > B.top
    );
}

function gameOver() {

    playing = false;

    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
            "jacobabsBestScore",
            bestScore
        );

        bestText.innerHTML = bestScore;
    }

    message.innerHTML =
        "💥 GAME OVER! Score: " +
        score +
        " | Coins: " +
        coins;

    startButton.innerHTML =
        "PLAY AGAIN";
}

function gameLoop() {

    if (!playing) {
        return;
    }

    for (var i = 0; i < lines.length; i++) {

        var lineTop =
            parseInt(lines[i].style.top);

        lineTop =
            lineTop + speed;

        if (lineTop > 520) {
            lineTop = -75;
        }

        lines[i].style.top =
            lineTop + "px";
    }

    for (var t = 0; t < trees.length; t++) {

        var treeTop =
            parseInt(trees[t].style.top);

        treeTop =
            treeTop + speed;

        if (treeTop > 520) {
            treeTop = -40;
        }

        trees[t].style.top =
            treeTop + "px";
    }

    for (var i = 0; i < enemies.length; i++) {

        enemyY[i] =
            enemyY[i] +
            speed +
            (i * 0.2);

        enemies[i].style.top =
            enemyY[i] + "px";

        if (enemyY[i] > 520) {

            enemyY[i] =
                -100 -
                Math.floor(Math.random() * 300);

            enemyX[i] =
                randomRoadX();

            enemies[i].style.left =
                enemyX[i] + "px";

            score++;

            scoreText.innerHTML =
                score;

            if (score % 5 === 0) {
                speed = speed + 0.5;
            }
        }

        if (collision(player, enemies[i])) {

            gameOver();
            return;
        }
    }

    coinY =
        coinY + speed;

    coin.style.top =
        coinY + "px";

    if (coinY > 520) {

        coinY = -100;
        coinX = randomRoadX();

        coin.style.left =
            coinX + "px";
    }

    if (collision(player, coin)) {

        coins++;

        score =
            score + 2;

        coinsText.innerHTML =
            coins;

        scoreText.innerHTML =
            score;

        coinY = -100;
        coinX = randomRoadX();

        coin.style.left =
            coinX + "px";
    }

    animation =
        requestAnimationFrame(gameLoop);
}

startButton.onclick = function() {
    startGame();
};

document.getElementById("leftButton").onclick =
function() {
    moveLeft();
};

document.getElementById("rightButton").onclick =
function() {
    moveRight();
};

document.onkeydown =
function(event) {

    if (event.key === "ArrowLeft") {
        moveLeft();
    }

    if (event.key === "ArrowRight") {
        moveRight();
    }
};

var touchStartX = 0;

document.getElementById("game").ontouchstart =
function(event) {

    touchStartX =
        event.touches[0].clientX;
};

document.getElementById("game").ontouchend =
function(event) {

    var touchEndX =
        event.changedTouches[0].clientX;

    if (touchEndX - touchStartX > 30) {
        moveRight();
    }

    if (touchStartX - touchEndX > 30) {
        moveLeft();
    }
};
</script>

</body>
</html>
