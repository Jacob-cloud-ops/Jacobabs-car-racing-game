<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacobabs Car Racing</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    margin: 12px 0 2px;
    font-size: 27px;
}

.subtitle {
    color: #bbb;
    margin-bottom: 8px;
}

#scoreBox {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin: 8px 0;
    font-size: 18px;
    font-weight: bold;
}

#game {
    position: relative;
    width: 340px;
    height: 540px;
    margin: auto;
    overflow: hidden;
    background: #555;
    border-left: 8px solid white;
    border-right: 8px solid white;
    box-shadow: 0 0 20px rgba(255,255,255,.15);
}

/* Grass */
.grass {
    position: absolute;
    top: 0;
    width: 40px;
    height: 100%;
    background: #218c45;
    z-index: 0;
}

#grassLeft {
    left: 0;
}

#grassRight {
    right: 0;
}

/* Road */
.road {
    position: absolute;
    left: 40px;
    right: 40px;
    top: 0;
    bottom: 0;
    background: #505050;
}

/* Lane lines */
.laneLine {
    position: absolute;
    width: 7px;
    height: 80px;
    background: white;
    left: 166px;
    z-index: 1;
}

/* Roadside trees */
.tree {
    position: absolute;
    width: 24px;
    height: 24px;
    background: #126b31;
    border-radius: 50%;
    z-index: 2;
}

.tree::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 18px;
    background: #704214;
    left: 8px;
    top: 18px;
}

/* Cars */
.car {
    position: absolute;
    width: 52px;
    height: 84px;
    border: 3px solid #111;
    border-radius: 13px 13px 8px 8px;
    z-index: 6;
}

/* Player */
#player {
    left: 144px;
    bottom: 28px;
    background: #e53935;
}

/* Car windows */
.car::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 9px;
    width: 32px;
    height: 27px;
    background: #9ee7f5;
    border: 2px solid #222;
    border-radius: 7px;
}

/* Car stripe */
.car::after {
    content: "";
    position: absolute;
    left: 21px;
    top: 39px;
    width: 7px;
    height: 37px;
    background: rgba(255,255,255,.45);
    border-radius: 4px;
}

/* Wheels */
.wheel {
    position: absolute;
    width: 9px;
    height: 22px;
    background: #111;
    border-radius: 5px;
}

.w1 {
    left: -7px;
    top: 15px;
}

.w2 {
    right: -7px;
    top: 15px;
}

.w3 {
    left: -7px;
    bottom: 15px;
}

.w4 {
    right: -7px;
    bottom: 15px;
}

/* Enemy colors */
.enemy1 {
    background: #1976d2;
}

.enemy2 {
    background: #fbc02d;
}

.enemy3 {
    background: #8e24aa;
}

/* Coins */
.coin {
    position: absolute;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: #ffd700;
    border: 3px solid #fff08a;
    z-index: 5;
    box-shadow: 0 0 10px #ffd700;
}

.coin::after {
    content: "$";
    color: #9a6900;
    font-size: 15px;
    font-weight: bold;
    line-height: 21px;
}

/* Overlay */
#overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

#overlay h2 {
    font-size: 34px;
    margin: 5px;
}

#overlay p {
    font-size: 18px;
    line-height: 1.5;
}

#startButton,
#restartButton {
    padding: 15px 30px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

#restartButton {
    display: none;
}

/* Controls */
.controls {
    margin: 12px auto;
    display: flex;
    justify-content: center;
    gap: 25px;
}

.controlButton {
    width: 90px;
    height: 60px;
    border: none;
    border-radius: 12px;
    background: #303030;
    color: white;
    font-size: 30px;
    font-weight: bold;
    box-shadow: 0 4px 0 #111;
}

.controlButton:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #111;
}

#instructions {
    color: #aaa;
    font-size: 14px;
    margin: 5px auto 15px;
    max-width: 340px;
}
</style>
</head>
