<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacobabs Car Racing</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

h1 {
    margin: 12px 0 4px;
    font-size: 28px;
}

#score {
    font-size: 20px;
    margin: 8px;
}

#game {
    position: relative;
    width: 330px;
    height: 520px;
    margin: auto;
    overflow: hidden;
    background: #555;
    border-left: 7px solid white;
    border-right: 7px solid white;
}

/* Road markings */
.line {
    position: absolute;
    width: 8px;
    height: 70px;
    background: white;
    left: 161px;
}

#l1 { top: 0; }
#l2 { top: 140px; }
#l3 { top: 280px; }
#l4 { top: 420px; }

/* Grass */
.grass {
    position: absolute;
    width: 35px;
    height: 100%;
    background: #238b45;
    top: 0;
}

#grass1 {
    left: 0;
}

#grass2 {
    right: 0;
}

/* Player car */
.car {
    position: absolute;
    width: 52px;
    height: 82px;
    bottom: 25px;
    left: 139px;
    background: #e53935;
    border-radius: 12px 12px 7px 7px;
    border: 3px solid #111;
    z-index: 5;
}

/* Windows */
.car::before {
    content: "";
    position: absolute;
    width: 34px;
    height: 25px;
    left: 6px;
    top: 9px;
    background: #80deea;
    border-radius: 6px;
    border: 2px solid #222;
}

/* Wheels */
.wheel {
    position: absolute;
    width: 8px;
    height: 22px;
    background: #111;
    border-radius: 4px;
}

.w1 {
    left: -7px;
    top: 13px;
}

.w2 {
    right: -7px;
    top: 13px;
}

.w3 {
    left: -7px;
    bottom: 13px;
}

.w4 {
    right: -7px;
    bottom: 13px;
}

/* Enemy car */
.enemy {
    position: absolute;
    width: 52px;
    height: 82px;
    top: -100px;
    background: #1976d2;
    border-radius: 12px 12px 7px 7px;
    border: 3px solid #111;
    z-index: 4;
}

.enemy::before {
    content: "";
    position: absolute;
    width: 34px;
    height: 25px;
    left: 6px;
    top: 9px;
    background: #b3e5fc;
    border-radius: 6px;
    border: 2px solid #222;
}

button {
    margin: 12px 5px;
    padding: 13px 22px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 9px;
}

#start {
    background: #16a34a;
    color: white;
}

.controls button {
    background: #333;
    color: white;
    font-size: 25px;
    width: 75px;
}
</style>
</head>

<body>

<h1>🏎️ Jacobabs Car Racing</h1>

<div id="score">Score: 0</div>

<div id="game">

    <div class="grass" id="grass1"></div>
    <div class="grass" id="grass2"></div>

    <div class="line" id="l1"></div>
    <div class="line" id="l2"></div>
    <div class="line" id="l3"></div>
    <div class="line" id="l4"></div>

    <div id="car" class="car">
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
        <div class="wheel w3"></div>
        <div class="wheel w4"></div>
    </div>

    <div id="enemy" class="enemy"></div>

</div>

<div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
</div>

<button id="start">START GAME</button>

<script>
const car = document.getElementById("car");
const enemy = document.getElementById("enemy");
const scoreText = document.getElementById("score");
const startButton = document.getElementById("start");

const lines = [
    document.getElementById("l1"),
    document.getElementById("l2"),
    document.getElementById("l3"),
    document.getElementById("l4")
];

let carLeft = 139;
let enemyTop = -100;
let enemyLeft = 80;
let score = 0;
let speed = 5;
let gameRunning = false;

function moveLeft() {
    if (!gameRunning) return;

    if (carLeft > 42) {
        carLeft -= 25;
        car.style.left = carLeft + "px";
    }
}

function moveRight() {
    if (!gameRunning) return;

    if (carLeft < 236) {
        carLeft += 25;
        car.style.left = carLeft + "px";
    }
}

document.getElementById("left").addEventListener("click", moveLeft);
document.getElementById("right").addEventListener("click", moveRight);

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowLeft") moveLeft();
    if (event.key === "ArrowRight") moveRight();
});

function startGame() {

    carLeft = 139;
    enemyTop = -100;
    enemyLeft = 50 + Math.floor(Math.random() * 190);

    score = 0;
    speed = 5;
    gameRunning = true;

    car.style.left = carLeft + "px";
    enemy.style.left = enemyLeft + "px";
    enemy.style.top = enemyTop + "px";

    scoreText.innerText = "Score: 0";
    startButton.innerText = "RESTART GAME";

    gameLoop();
}

function gameLoop() {

    if (!gameRunning) return;

    /* Move enemy */
    enemyTop += speed;
    enemy.style.top = enemyTop + "px";

    /* Move road lines */
    lines.forEach(function(line) {

        let top = parseInt(line.style.top || getComputedStyle(line).top);

        top += speed;

        if (top > 520) {
            top = -70;
        }

        line.style.top = top + "px";
    });

    /* Enemy passed */
    if (enemyTop > 520) {

        enemyTop = -100;
        enemyLeft = 50 + Math.floor(Math.random() * 190);

        enemy.style.left = enemyLeft + "px";

        score++;
        scoreText.innerText = "Score: " + score;

        if (score % 5 === 0) {
            speed += 0.7;
        }
    }

    /* Collision */
    const carRect = car.getBoundingClientRect();
    const enemyRect = enemy.getBoundingClientRect();

    if (
        carRect.left < enemyRect.right &&
        carRect.right > enemyRect.left &&
        carRect.top < enemyRect.bottom &&
        carRect.bottom > enemyRect.top
    ) {

        gameRunning = false;

        alert(
            "🏁 GAME OVER!\n\nYour score: " + score
        );
    }

    requestAnimationFrame(gameLoop);
}

startButton.addEventListener("click", startGame);
</script>

</body>
</html>
