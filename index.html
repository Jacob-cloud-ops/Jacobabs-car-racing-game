<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacobabs Car Racing</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 12px 0 4px;
    font-size: 27px;
}

#score {
    font-size: 20px;
    margin: 8px;
}

#game {
    position: relative;
    width: 330px;
    height: 520px;
    margin: auto;
    overflow: hidden;
    background: #555;
    border-left: 7px solid white;
    border-right: 7px solid white;
}

.grass {
    position: absolute;
    top: 0;
    width: 38px;
    height: 100%;
    background: #218c45;
}

#grassLeft {
    left: 0;
}

#grassRight {
    right: 0;
}

.road {
    position: absolute;
    left: 38px;
    right: 38px;
    top: 0;
    bottom: 0;
    background: #555;
}

.line {
    position: absolute;
    width: 7px;
    height: 75px;
    background: white;
    left: 161px;
}

.car {
    position: absolute;
    width: 52px;
    height: 84px;
    border: 3px solid #111;
    border-radius: 13px;
    z-index: 5;
}

.car::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 9px;
    width: 32px;
    height: 26px;
    background: #9ee7f5;
    border: 2px solid #222;
    border-radius: 7px;
}

.player {
    background: #e53935;
    bottom: 25px;
    left: 139px;
}

.enemy {
    background: #1976d2;
    top: -100px;
}

.wheel {
    position: absolute;
    width: 8px;
    height: 21px;
    background: #111;
    border-radius: 4px;
}

.w1 {
    left: -7px;
    top: 15px;
}

.w2 {
    right: -7px;
    top: 15px;
}

.w3 {
    left: -7px;
    bottom: 15px;
}

.w4 {
    right: -7px;
    bottom: 15px;
}

#startButton {
    margin-top: 12px;
    padding: 14px 28px;
    border: 0;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

.controls {
    margin-top: 12px;
}

.controlButton {
    width: 85px;
    height: 58px;
    margin: 0 10px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 28px;
}

#message {
    margin: 10px;
    font-size: 18px;
    min-height: 25px;
}
</style>
</head>

<body>

<h1>🏎️ Jacobabs Car Racing</h1>

<div id="score">Score: 0</div>

<div id="game">

    <div class="grass" id="grassLeft"></div>
    <div class="grass" id="grassRight"></div>
    <div class="road"></div>

    <div class="line" id="line1" style="top:0"></div>
    <div class="line" id="line2" style="top:140px"></div>
    <div class="line" id="line3" style="top:280px"></div>
    <div class="line" id="line4" style="top:420px"></div>

    <div id="player" class="car player">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

    <div id="enemy" class="car enemy">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

</div>

<div id="message">Press START GAME to begin</div>

<button id="startButton">START GAME</button>

<div class="controls">
    <button class="controlButton" id="leftButton">⬅️</button>
    <button class="controlButton" id="rightButton">➡️</button>
</div>

<script>
var player = document.getElementById("player");
var enemy = document.getElementById("enemy");
var scoreText = document.getElementById("score");
var message = document.getElementById("message");
var startButton = document.getElementById("startButton");

var lines = [
    document.getElementById("line1"),
    document.getElementById("line2"),
    document.getElementById("line3"),
    document.getElementById("line4")
];

var playerX = 139;
var enemyX = 80;
var enemyY = -100;
var score = 0;
var speed = 5;
var playing = false;
var animation = null;

function moveLeft() {
    if (!playing) return;

    playerX = playerX - 25;

    if (playerX < 45) {
        playerX = 45;
    }

    player.style.left = playerX + "px";
}

function moveRight() {
    if (!playing) return;

    playerX = playerX + 25;

    if (playerX > 235) {
        playerX = 235;
    }

    player.style.left = playerX + "px";
}

function startGame() {

    if (animation) {
        cancelAnimationFrame(animation);
    }

    playerX = 139;
    enemyX = 50 + Math.floor(Math.random() * 190);
    enemyY = -100;

    score = 0;
    speed = 5;
    playing = true;

    player.style.left = playerX + "px";
    enemy.style.left = enemyX + "px";
    enemy.style.top = enemyY + "px";

    scoreText.innerHTML = "Score: 0";
    message.innerHTML = "Avoid the blue car!";

    startButton.innerHTML = "RESTART GAME";

    animation = requestAnimationFrame(gameLoop);
}

function gameLoop() {

    if (!playing) {
        return;
    }

    enemyY = enemyY + speed;
    enemy.style.top = enemyY + "px";

    for (var i = 0; i < lines.length; i++) {

        var lineTop = parseInt(lines[i].style.top);

        lineTop = lineTop + speed;

        if (lineTop > 520) {
            lineTop = -75;
        }

        lines[i].style.top = lineTop + "px";
    }

    if (enemyY > 520) {

        enemyY = -100;
        enemyX = 50 + Math.floor(Math.random() * 190);

        enemy.style.left = enemyX + "px";

        score = score + 1;
        scoreText.innerHTML = "Score: " + score;

        if (score % 5 === 0) {
            speed = speed + 1;
        }
    }

    var playerBox = player.getBoundingClientRect();
    var enemyBox = enemy.getBoundingClientRect();

    var crash =
        playerBox.left < enemyBox.right &&
        playerBox.right > enemyBox.left &&
        playerBox.top < enemyBox.bottom &&
        playerBox.bottom > enemyBox.top;

    if (crash) {

        playing = false;

        message.innerHTML =
            "💥 GAME OVER! Score: " + score;

        startButton.innerHTML = "PLAY AGAIN";

        return;
    }

    animation = requestAnimationFrame(gameLoop);
}

startButton.addEventListener("click", startGame);
document.getElementById("leftButton").addEventListener("click", moveLeft);
document.getElementById("rightButton").addEventListener("click", moveRight);

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
        moveLeft();
    }

    if (event.key === "ArrowRight") {
        moveRight();
    }
});

message.innerHTML = "Press START GAME to begin";
</script>

</body>
</html>
