<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacobabs Car Racing</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px 0 5px;
}

#score {
    font-size: 22px;
    margin: 10px;
}

#game {
    position: relative;
    width: 320px;
    height: 500px;
    margin: auto;
    overflow: hidden;
    background: #555;
    border-left: 8px solid white;
    border-right: 8px solid white;
}

.grass {
    position: absolute;
    top: 0;
    width: 35px;
    height: 100%;
    background: #16833c;
}

#grassLeft {
    left: 0;
}

#grassRight {
    right: 0;
}

.road {
    position: absolute;
    left: 35px;
    right: 35px;
    top: 0;
    bottom: 0;
    background: #555;
}

.line {
    position: absolute;
    width: 7px;
    height: 70px;
    background: white;
    left: 156px;
}

.car {
    position: absolute;
    width: 50px;
    height: 80px;
    border: 3px solid #111;
    border-radius: 12px;
}

#player {
    left: 135px;
    bottom: 25px;
    background: red;
}

#enemy {
    left: 100px;
    top: -100px;
    background: blue;
}

.car::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 8px;
    width: 31px;
    height: 25px;
    background: #9ee7f5;
    border: 2px solid #222;
    border-radius: 6px;
}

.wheel {
    position: absolute;
    width: 8px;
    height: 20px;
    background: black;
    border-radius: 4px;
}

.w1 {
    left: -7px;
    top: 15px;
}

.w2 {
    right: -7px;
    top: 15px;
}

.w3 {
    left: -7px;
    bottom: 15px;
}

.w4 {
    right: -7px;
    bottom: 15px;
}

#startButton {
    margin: 15px;
    padding: 15px 30px;
    background: green;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
}

.control {
    width: 80px;
    height: 55px;
    margin: 5px;
    background: #333;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 25px;
}

#message {
    min-height: 25px;
    margin: 8px;
}
</style>
</head>

<body>

<h1>🏎️ Jacobabs Car Racing</h1>

<div id="score">Score: 0</div>

<div id="game">

    <div class="grass" id="grassLeft"></div>
    <div class="grass" id="grassRight"></div>
    <div class="road"></div>

    <div class="line" id="line1" style="top:0"></div>
    <div class="line" id="line2" style="top:140px"></div>
    <div class="line" id="line3" style="top:280px"></div>
    <div class="line" id="line4" style="top:420px"></div>

    <div id="player" class="car">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

    <div id="enemy" class="car">
        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>
    </div>

</div>

<div id="message">Press START GAME to begin</div>

<button type="button" id="startButton">START GAME</button>

<div>
    <button type="button" class="control" id="leftButton">⬅️</button>
    <button type="button" class="control" id="rightButton">➡️</button>
</div>

<script>
var player = document.getElementById("player");
var enemy = document.getElementById("enemy");
var startButton = document.getElementById("startButton");
var scoreText = document.getElementById("score");
var message = document.getElementById("message");

var lines = document.querySelectorAll(".line");

var playerX = 135;
var enemyX = 100;
var enemyY = -100;
var score = 0;
var speed = 5;
var playing = false;
var animation = null;

function moveLeft() {
    if (!playing) {
        return;
    }

    playerX = playerX - 25;

    if (playerX < 40) {
        playerX = 40;
    }

    player.style.left = playerX + "px";
}

function moveRight() {
    if (!playing) {
        return;
    }

    playerX = playerX + 25;

    if (playerX > 230) {
        playerX = 230;
    }

    player.style.left = playerX + "px";
}

function startGame() {

    playing = true;

    score = 0;
    speed = 5;

    playerX = 135;
    enemyY = -100;
    enemyX = 50 + Math.floor(Math.random() * 180);

    player.style.left = playerX + "px";
    enemy.style.left = enemyX + "px";
    enemy.style.top = enemyY + "px";

    scoreText.innerHTML = "Score: 0";
    message.innerHTML = "Avoid the blue car!";

    startButton.innerHTML = "RESTART GAME";

    if (animation !== null) {
        cancelAnimationFrame(animation);
    }

    gameLoop();
}

function gameLoop() {

    if (!playing) {
        return;
    }

    enemyY = enemyY + speed;

    enemy.style.top = enemyY + "px";

    for (var i = 0; i < lines.length; i++) {

        var currentTop = parseInt(lines[i].style.top);

        currentTop = currentTop + speed;

        if (currentTop > 500) {
            currentTop = -70;
        }

        lines[i].style.top = currentTop + "px";
    }

    if (enemyY > 500) {

        enemyY = -100;

        enemyX = 50 + Math.floor(Math.random() * 180);

        enemy.style.left = enemyX + "px";

        score = score + 1;

        scoreText.innerHTML = "Score: " + score;

        if (score % 5 === 0) {
            speed = speed + 1;
        }
    }

    var playerBox = player.getBoundingClientRect();
    var enemyBox = enemy.getBoundingClientRect();

    if (
        playerBox.left < enemyBox.right &&
        playerBox.right > enemyBox.left &&
        playerBox.top < enemyBox.bottom &&
        playerBox.bottom > enemyBox.top
    ) {

        playing = false;

        message.innerHTML =
            "💥 GAME OVER! Score: " + score;

        startButton.innerHTML = "PLAY AGAIN";

        return;
    }

    animation = requestAnimationFrame(gameLoop);
}

startButton.onclick = function() {
    startGame();
};

document.getElementById("leftButton").onclick = function() {
    moveLeft();
};

document.getElementById("rightButton").onclick = function() {
    moveRight();
};

document.onkeydown = function(event) {

    if (event.key === "ArrowLeft") {
        moveLeft();
    }

    if (event.key === "ArrowRight") {
        moveRight();
    }
};

message.innerHTML = "Press START GAME to begin";
</script>

</body>
</html>
